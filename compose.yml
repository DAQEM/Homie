services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kevin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kevin_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kevin -d kevin_home"]
      interval: 2s
      timeout: 5s
      retries: 10

  homie:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kevin:secret@db:5432/kevin_home?sslmode=disable
      BIND_ADDR: 0.0.0.0:8080
      # 32-byte hex-encoded master key (64 hex chars) for AES-256-GCM credential encryption
      MASTER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "8080:8080"

volumes:
  pgdata:
