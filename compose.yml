services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kevin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kevin_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kevin -d kevin_home"]
      interval: 2s
      timeout: 5s
      retries: 10

  homie:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kevin:secret@db:5432/kevin_home?sslmode=disable
      BIND_ADDR: 0.0.0.0:8080
      # 32-byte hex-encoded master key (64 hex chars) for AES-256-GCM credential & OIDC token encryption
      MASTER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Optional OIDC / Authentik Authentication (leave OIDC_ISSUER_URL unset for local single-user mode)
      # OIDC_ISSUER_URL: https://auth.example.com/application/o/homie/
      # OIDC_CLIENT_ID: your-client-id
      # OIDC_CLIENT_SECRET: your-client-secret
      # OIDC_REDIRECT_URL: https://homie.example.com/api/v1/auth/callback
      # OIDC_POST_LOGOUT_REDIRECT_URL: https://homie.example.com/
      # OIDC_PROVIDER_NAME: Authentik
      # OIDC_SCOPES: openid profile email offline_access
      # OIDC_ALLOWED_GROUPS: ""
      # OIDC_INSECURE_SKIP_VERIFY: "false"
      # SESSION_SECRET: ""
      # SESSION_TTL_HOURS: "168"
      # COOKIE_SECURE: "auto"
    ports:
      - "8080:8080"

volumes:
  pgdata:
